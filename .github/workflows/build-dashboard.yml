name: Build Dashboard

on:
  schedule:
    # Run daily at 8 AM UTC, after the Lighthouse monitor has had time to finish
    - cron: '0 8 * * *'
  workflow_dispatch: # Manual trigger
  workflow_run:
    workflows: ["Lighthouse Monitor - Top 50 Universities"]
    types:
      - completed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-dashboard:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        # After a monitor run, build the results it just committed rather than the commit it started from
        ref: ${{ github.event.repository.default_branch }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Create dashboard only
      run: python build_dashboard_new.py

    - name: Setup Pages
      uses: actions/configure-pages@v5

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: './docs'

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
